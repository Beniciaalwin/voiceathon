services:
  # 1. Backend Express Web Service
  - type: web
    name: snapserve-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm --prefix backend install && npm --prefix backend run build
    startCommand: npm --prefix backend start
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: SNAPSERVE_WEBHOOK_SECRET
        value: snapserve_sec_987654321_token
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # 2. Frontend React Vite Static Site
  - type: web
    name: snapserve-frontend
    env: static
    region: singapore
    plan: free
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: snapserve-backend
          property: host
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
